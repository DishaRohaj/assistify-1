spring.application.name=backend

# Server
server.port=${PORT:8080}

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assistify}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForAssistifyDevelopmentOnly123456}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

